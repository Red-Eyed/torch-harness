[project]
name = "torch-harness"
version = "0.16.0"
description = "Reliable utilities for PyTorch and Lightning"
readme = "README.md"
authors = [
    { name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "jaxtyping>=0.3.11",
    "loguru>=0.7",
    "torch>=2.0",
    "typing-extensions>=4.4",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["lightning", "machine-learning", "pytorch", "torch"]

[project.optional-dependencies]
lightning = ["lightning>=2.6,<3"]
onnx = ["onnx>=1.18"]

[project.urls]
Repository = "https://github.com/Red-Eyed/torch-harness"
Issues = "https://github.com/Red-Eyed/torch-harness/issues"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lightning>=2.6,<3",
    "onnx>=1.18",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "scipy>=1.17.1",
]
