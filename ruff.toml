line-length = 88
src = ["src"]
target-version = "py311"

[lint]
select = [
    "ANN",
    "B",
    "D",
    "E",
    "F",
    "I",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "W",
]
# jaxtyping shape strings are not Python forward annotations.
ignore = ["F722", "F821"]

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true
